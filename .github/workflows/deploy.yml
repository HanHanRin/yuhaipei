name: Deploy to GitHub Pages

# 推到 main 就自动构建并发布；也可以在 Actions 页面手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的排队等旧的结束
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # output: export 不能带 App Router API；本地/Node 部署才需要 /api/chat
      - name: Exclude API routes for static export
        run: mv src/app/api /tmp/yuhaipei-api-skip

      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          # 仓库名叫 yuhaipei，站点挂在 hanhanrin.github.io/yuhaipei 下
          NEXT_PUBLIC_BASE_PATH: /yuhaipei

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
