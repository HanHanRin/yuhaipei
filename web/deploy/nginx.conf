# Nginx 反向代理配置 · 备案通过、域名解析好之后再启用
#
#   cp deploy/nginx.conf /etc/nginx/sites-available/yuhaipei
#   ln -s /etc/nginx/sites-available/yuhaipei /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# HTTPS 证书用 certbot 一条命令签发并自动续期：
#   apt-get install -y certbot python3-certbot-nginx
#   certbot --nginx -d 你的域名.cn -d www.你的域名.cn
#
# 备案通过之前，中国大陆地域的服务器 80 端口无法对外提供网站服务，
# 这段时间直接用 http://<公网IP>:3000 看效果。

server {
    listen 80;
    listen [::]:80;
    server_name 你的域名.cn www.你的域名.cn;

    # Next.js 的构建产物带内容哈希，可以长期缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 以后 AI 分身走流式返回，这两行必须有，
        # 否则 Nginx 会把整段响应缓冲到结束才吐出来，打字机效果全没了
        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 300s;
    }

    client_max_body_size 12m;   # 预留给 JD 截图上传

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
